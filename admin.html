<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard — ALI FX</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 border-r border-slate-800 p-6 flex flex-col justify-between hidden md:flex">
        <div>
            <div class="text-2xl font-black tracking-wider text-blue-500 mb-10">
                ALI<span class="text-white">.FX</span> <span class="text-xs text-slate-400 block font-normal">Admin Panel</span>
            </div>
            <nav class="space-y-2 text-sm font-medium">
                <a href="#" class="block px-4 py-2.5 bg-blue-600 text-white rounded-xl">Dashboard</a>
                <a href="#" class="block px-4 py-2.5 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl transition">Clients</a>
            </nav>
        </div>
        <div>
            <a href="index.html" class="block px-4 py-2.5 text-red-400 hover:bg-red-950/30 rounded-xl text-sm font-semibold transition">Log Out</a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-8 overflow-y-auto">
        <header class="flex justify-between items-center mb-8 pb-4 border-b border-slate-800">
            <h1 class="text-2xl font-bold">Dashboard Overview</h1>
            <a href="index.html" class="text-xs text-blue-400 hover:underline">← Back to Website</a>
        </header>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="p-6 bg-slate-900 border border-slate-800 rounded-xl">
                <p class="text-xs text-slate-400 mb-1">Total Clients</p>
                <h3 class="text-3xl font-extrabold text-blue-400">1,248</h3>
            </div>
            <div class="p-6 bg-slate-900 border border-slate-800 rounded-xl">
                <p class="text-xs text-slate-400 mb-1">Active Deposits</p>
                <h3 class="text-3xl font-extrabold text-emerald-400">$45,230</h3>
            </div>
            <div class="p-6 bg-slate-900 border border-slate-800 rounded-xl">
                <p class="text-xs text-slate-400 mb-1">Pending Approvals</p>
                <h3 class="text-3xl font-extrabold text-amber-400">14</h3>
            </div>
        </div>
    </main>
</body>
</html>
