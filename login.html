<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — ALI FX</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md p-8 bg-slate-900 border border-slate-800 rounded-2xl shadow-xl">
        <div class="text-center mb-8">
            <a href="index.html" class="text-2xl font-black tracking-wider text-blue-500">
                ALI<span class="text-white">.FX</span>
            </a>
            <h2 class="text-xl font-bold mt-4">Welcome Back</h2>
            <p class="text-xs text-slate-400">Sign in to your trading portal</p>
        </div>
        <form class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Email Address</label>
                <input type="email" required class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-blue-600 text-sm" placeholder="name@example.com">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Password</label>
                <input type="password" required class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-blue-600 text-sm" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-500 font-semibold rounded-xl transition shadow-lg shadow-blue-600/30 text-sm">Log In</button>
        </form>
        <p class="text-center text-xs text-slate-400 mt-6">
            Don't have an account? <a href="register.html" class="text-blue-400 font-semibold hover:underline">Register here</a>
        </p>
    </div>
</body>
</html>
